<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f5ef">
<title>一笔一画，日积月累</title>
<style>
:root{--ink:#2d4239;--green:#446b5c;--muted:#839289;--line:#e8ebe3;--paper:#fffefb;--bg:#f7f5ef}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,select{font:inherit;color:inherit}button{cursor:pointer}header{background:rgba(255,254,251,.96);border-bottom:1px solid var(--line)}.bar{max-width:1280px;margin:auto;min-height:76px;padding:0 36px;display:flex;align-items:center;gap:28px}.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.12em;white-space:nowrap}.seal{display:grid;place-items:center;background:var(--green);color:#fff;width:38px;height:38px;border-radius:11px;font-family:KaiTi,STKaiti,serif;font-size:23px}.nav{display:flex;align-items:center;gap:6px;margin-left:auto}.nav>button,.nav>details>summary{display:block;border:0;background:transparent;padding:12px 17px;text-decoration:none;border-radius:9px;white-space:nowrap;font-size:14px;color:#718078;list-style:none;cursor:pointer}.nav>button.active{background:#e8efe7;color:#365c4c;font-weight:700}.nav>button:hover,.nav>details>summary:hover{background:#f1f4ee}summary::-webkit-details-marker{display:none}details{position:relative}.nav>.book{min-width:0;max-width:340px}.nav>.book>summary{display:flex;align-items:center;gap:8px;color:#405e4e;background:#f2f5ef;min-width:0}.book-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.book-arrow{flex:none}.popup{position:absolute;z-index:3;right:0;top:calc(100% + 9px);width:260px;padding:16px;background:#fffefb;border:1px solid #e6ebe2;border-radius:14px;box-shadow:0 15px 40px #344a3820}.popup label{display:block;font-size:12px;color:#91a097;margin:0 0 7px}.popup select{width:100%;border:1px solid #e2e9df;border-radius:8px;background:#fff;padding:10px;margin-bottom:12px}.popup select:last-child{margin:0}main{max-width:1080px;margin:0 auto;padding:72px 36px 100px}.sheet{background:var(--paper);border:1px solid #e8ece4;border-radius:20px;padding:46px 54px 60px;min-height:400px;box-shadow:0 12px 35px rgba(48,76,56,.04)}.heading{margin:0 0 34px;padding-bottom:25px;border-bottom:1px solid #edf0e9}h1{margin:0;font-family:KaiTi,STKaiti,"Kaiti SC",serif;font-size:30px;letter-spacing:.07em;font-weight:600}.poet{margin:10px 0 0;color:#839289;font-family:KaiTi,STKaiti,"Kaiti SC",serif;font-size:16px}.poet[hidden]{display:none}.review-status{margin:12px 0 0;color:#849389;font-size:12px;line-height:1.6}.review-status[hidden]{display:none}.words-flow{display:flex;flex-wrap:wrap;align-items:flex-start;gap:18px 22px}.word-group{display:flex;flex-wrap:wrap;max-width:100%}.content{display:grid;gap:25px}.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.char-wrap{display:inline-flex;flex-direction:column;align-items:center;flex:none}.pronunciation{height:21px;line-height:21px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-size:14px;color:#758b7b}.cell{width:70px;height:70px;display:grid;place-items:center;flex:none;border:1px solid #cad8cb;background:linear-gradient(45deg,transparent 49.5%,#e2eae1 50%,transparent 50.5%),linear-gradient(-45deg,transparent 49.5%,#e2eae1 50%,transparent 50.5%),linear-gradient(to right,transparent 49.5%,#dce6db 50%,transparent 50.5%),linear-gradient(to bottom,transparent 49.5%,#dce6db 50%,transparent 50.5%);font-family:KaiTi,STKaiti,"Kaiti SC",serif;font-size:43px;color:#304b41}.punct{font-family:KaiTi,STKaiti,serif;font-size:25px;align-self:flex-end;padding-bottom:5px}.empty{font-size:14px;color:#9aa89c;padding:42px 0}.sr-only{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}@media(max-width:700px){.bar{padding:14px 17px;gap:12px;flex-wrap:wrap}.brand{margin-right:auto}.nav{width:100%;justify-content:flex-end;gap:0}.nav>button,.nav>details>summary{padding:10px 12px;font-size:13px}.nav>.book{max-width:calc(100% - 108px)}main{padding:25px 16px 60px}.sheet{padding:28px 20px 40px;min-height:350px}.heading{margin-bottom:26px}h1{font-size:26px}.cell{width:52px;height:52px;font-size:33px}.row{gap:5px}.words-flow{gap:16px 14px}.content{gap:16px}.popup{width:230px}.punct{font-size:21px}}
</style>
</head>
<body>
<header><div class="bar"><div class="brand"><span class="seal">笔</span><span>一笔一画，日积月累</span></div><nav class="nav" aria-label="主导航"><button id="words" class="active">字词</button><button id="poems">诗词</button><details class="book" id="book"><summary id="bookLabel"><span class="book-title" id="bookTitle">选择内容</span><span class="book-arrow" aria-hidden="true">▾</span></summary><div class="popup"><label for="grade">年级</label><select id="grade"></select><label for="term">学期</label><select id="term"><option>上册</option><option>下册</option></select><label for="directory">目录</label><select id="directory" disabled><option>暂无内容</option></select></div></details></nav></div></header>
<main><section class="sheet"><div class="heading"><h1 id="title"></h1><p class="poet" id="poet" hidden></p><p class="review-status" id="reviewStatus" hidden></p></div><div id="content" class="content"></div></section></main>
<script>
const $=s=>document.querySelector(s);const base=location.hostname.endsWith('.github.io')?'/rijiyuelei':'';let records=[],mode='字词',selected='';const grades=['一年级','二年级','三年级','四年级','五年级','六年级'];$('#grade').innerHTML=grades.map(g=>`<option ${g==='六年级'?'selected':''}>${g}</option>`).join('');
function parseCSV(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell.replace(/\r$/,''));rows.push(row)}const headers=rows.shift().map(x=>x.replace(/^\uFEFF/,''));return rows.filter(r=>r.some(Boolean)).map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]||''])))}
function available(){const types=mode==='字词'?['汉字','词语']:['古诗','日积月累'];return records.filter(r=>r['年级']===$('#grade').value&&r['学期']===$('#term').value&&types.includes(r['类型']))}
function key(r){return r['ID']}
function addCells(text,container,syllables=[]){let index=0;for(const c of text){if(/\s/.test(c))continue;if(!/[\u3400-\u9fff]/.test(c)){const el=document.createElement('span');el.className='punct';el.textContent=c;container.appendChild(el);continue}const wrap=document.createElement('span');wrap.className='char-wrap';const py=document.createElement('span');py.className='pronunciation';const syllable=syllables[index++]||'';py.textContent=syllable==='_'?'':syllable;py.setAttribute('aria-hidden','true');const el=document.createElement('span');el.className='cell';el.textContent=c;wrap.append(py,el);container.appendChild(wrap)}}
function render(){const data=available(),choices=[...new Map(data.map(r=>[key(r),r])).entries()];if(!choices.some(([k])=>k===selected))selected=choices[0]?.[0]||'';const choice=choices.find(([k])=>k===selected)?.[1];const label=$('#grade').value+' · '+$('#term').value+' · '+(choice?(mode==='字词'?choice['课文']:choice['标题']):'暂无内容');$('#bookTitle').textContent=label;$('#bookLabel').title=label;$('#words').classList.toggle('active',mode==='字词');$('#poems').classList.toggle('active',mode==='诗词');const directory=$('#directory');directory.replaceChildren();directory.disabled=!choices.length;if(!choices.length)directory.add(new Option('暂无内容',''));choices.forEach(([k,r],i)=>directory.add(new Option(mode==='字词'?r['课文']:r['标题'],String(i),false,k===selected)));const current=data.filter(r=>key(r)===selected);$('#title').textContent=current.length?(mode==='字词'?current[0]['课文']:current[0]['标题']):'暂无内容';const poet=$('#poet');const dynasty=current[0]?.['朝代']?.trim()||'';const author=current[0]?.['作者']?.trim()||'';poet.textContent=[dynasty?'['+dynasty+']':'',author].filter(Boolean).join(' ');poet.hidden=mode!=='诗词'||!poet.textContent;const status=$('#reviewStatus');status.textContent=current[0]?.['核对状态']||'';status.hidden=!status.textContent;const content=$('#content');content.replaceChildren();if(!current.length){let p=document.createElement('div');p.className='empty';p.textContent='请选择其他课本。';content.appendChild(p);return}for(const r of current){let text=r['内容'].replace(/\\n/g,'\n');const lines=r['类型']==='词语'?text.split('|'):text.split('\n');const pinyin=(r['拼音']||'').replace(/\\n/g,'\n');let chunks=r['类型']==='词语'?pinyin.split('|'):lines.map(()=>[]);if(r['类型']!=='词语'){const all=pinyin.trim()?pinyin.trim().split(/\s+/):[];let offset=0;chunks=lines.map(line=>{let size=(line.match(/[\u3400-\u9fff]/g)||[]).length;let part=all.slice(offset,offset+size);offset+=size;return part});if(offset!==all.length)chunks=lines.map(()=>[])}const flow=r['类型']==='词语'?document.createElement('div'):null;if(flow){flow.className='words-flow';content.appendChild(flow)}lines.forEach((line,i)=>{let row=document.createElement('div');row.className=flow?'word-group':'row';let syllables=Array.isArray(chunks[i])?chunks[i]:(chunks[i]||'').trim().split(/\s+/).filter(Boolean);if(syllables.length!==(line.match(/[\u3400-\u9fff]/g)||[]).length)syllables=[];addCells(line,row,syllables);(flow||content).appendChild(row)})}}
function syncURL(replace=false){const rows=available();const r=rows.find(row=>key(row)===selected);let target;if(r){target=base+'/'+(mode==='字词'?'words':'poems')+'/'+[r['ID'],r['年级'],r['学期'],mode==='字词'?r['课文']:r['标题']].map(encodeURIComponent).join('/')+'/'}else{const query=new URLSearchParams({module:mode==='字词'?'words':'poems',grade:$('#grade').value,term:$('#term').value});target=base+'/?'+query}if(location.pathname+location.search!==target)history[replace?'replaceState':'pushState']({},'',target)}
function navigate(){render();syncURL()}
function restore(){let parts;try{parts=location.pathname.slice(base.length).split('/').filter(Boolean).map(decodeURIComponent)}catch{parts=[]}const query=new URLSearchParams(location.search);const category=parts[0]||query.get('module');if(category==='words'||category==='poems')mode=category==='words'?'字词':'诗词';const grade=parts[2]||query.get('grade');const term=parts[3]||query.get('term');if(grades.includes(grade))$('#grade').value=grade;if(term==='上册'||term==='下册')$('#term').value=term;selected=parts[1]||'';render();syncURL(true)}
$('#directory').onchange=()=>{const choices=[...new Map(available().map(r=>[key(r),r])).entries()];const choice=choices[Number($('#directory').value)];if(choice){selected=choice[0];navigate()}};$('#words').onclick=()=>{mode='字词';selected='';navigate()};$('#poems').onclick=()=>{mode='诗词';selected='';navigate()};$('#grade').onchange=$('#term').onchange=()=>{selected='';navigate()};window.addEventListener('popstate',restore);document.addEventListener('click',e=>{for(const d of document.querySelectorAll('details'))if(!d.contains(e.target))d.open=false});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('details').forEach(d=>d.open=false)});
Promise.all(['/words.csv','/poems.csv'].map(path=>fetch(base+path+'?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.text()}))).then(([wordText,poemText])=>{const words=parseCSV(wordText).flatMap(row=>['汉字','词语'].filter(type=>row[type]?.trim()).map(type=>({...row,'类型':type,'标题':type,'内容':row[type],'拼音':row[type+'拼音']})));const poems=parseCSV(poemText).map(row=>({...row,'类型':'古诗','内容':row['正文'],'拼音':row['正文拼音']}));records=[...words,...poems];restore()}).catch(()=>{$('#title').textContent='内容加载失败'});
</script></body></html>
