<!doctype html>

<title>一笔一画，日积月累</title>
<style>
:root{--ink:#2d4239;--green:#446b5c;--muted:#839289;--line:#e8ebe3;--paper:#fffefb;--bg:#f7f5ef}
*{box-sizing:border-box}body{margin:0;min-width:1440px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,select{font:inherit;color:inherit}button{cursor:pointer}header{background:rgba(255,254,251,.96);border-bottom:1px solid var(--line)}.bar{min-width:1440px;max-width:1440px;margin:auto;min-height:76px;padding:0 36px;display:flex;align-items:center;gap:28px}.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.12em;white-space:nowrap}.seal{display:grid;place-items:center;background:var(--green);color:#fff;width:38px;height:38px;border-radius:11px;font-family:"LXGW WenKai GB";font-size:23px}.nav{display:flex;align-items:center;gap:6px;margin-left:auto}.nav>button,.nav>details>summary{display:block;border:0;background:transparent;padding:12px 17px;text-decoration:none;border-radius:9px;white-space:nowrap;font-size:14px;color:#718078;list-style:none;cursor:pointer}.nav>button.active{background:#e8efe7;color:#365c4c;font-weight:700}.nav>button:hover,.nav>details>summary:hover{background:#f1f4ee}summary::-webkit-details-marker{display:none}details{position:relative}.nav>.book{min-width:0;max-width:340px}.nav>.book>summary{display:flex;align-items:center;gap:8px;color:#405e4e;background:#f2f5ef;min-width:0}.book-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.book-arrow{flex:none}.popup{position:absolute;z-index:3;right:0;top:calc(100% + 9px);width:260px;padding:16px;background:#fffefb;border:1px solid #e6ebe2;border-radius:14px;box-shadow:0 15px 40px #344a3820}.popup label{display:block;font-size:12px;color:#91a097;margin:0 0 7px}.popup select{width:100%;border:1px solid #e2e9df;border-radius:8px;background:#fff;padding:10px;margin-bottom:12px}.popup select:last-child{margin:0}main{min-width:1440px;max-width:1440px;margin:0 auto;padding:72px 36px 100px}.sheet{--content-font:"LXGW WenKai GB";background:var(--paper);border:1px solid #e8ece4;border-radius:20px;padding:46px 24px 60px;min-height:400px;box-shadow:0 12px 35px rgba(48,76,56,.04)}.sheet.brush-font{--content-font:"Chill Long Cang","LXGW WenKai GB"}.heading{margin:0 0 34px;padding-bottom:25px;border-bottom:1px solid #edf0e9}.heading-top{display:flex;align-items:center;gap:16px}.heading-top h1{flex:1;min-width:0}.font-toggle{display:grid;place-items:center;width:40px;height:40px;flex:none;padding:7px;border:1px solid #e2e9df;border-radius:10px;background:#f7f9f5;color:#52715f}.font-toggle:hover,.font-toggle[aria-pressed="true"]{background:#e8efe7;color:#365c4c}.font-toggle:focus-visible{outline:2px solid #52715f;outline-offset:2px}.font-toggle svg{width:26px;height:26px}h1{margin:0;font-family:var(--content-font);font-size:30px;letter-spacing:.07em;font-weight:600}.poet{margin:10px 0 0;color:#839289;font-family:var(--content-font);font-size:16px}.poet[hidden]{display:none}.words-flow{display:flex;flex-wrap:wrap;align-items:flex-start;gap:25px 22px}.word-group{display:flex;max-width:100%}.word-group>.char-wrap+.char-wrap,.row>.char-wrap+.char-wrap,.verse-clause>.char-wrap+.char-wrap{margin-left:-1px}.content{display:grid;gap:25px}.row{display:flex;flex-wrap:wrap;align-items:center;gap:25px 0}.poem-row{gap:25px 22px;align-items:flex-start}.verse-clause{display:flex;flex-wrap:wrap;align-items:center;gap:25px 0;max-width:100%}.char-wrap{display:inline-flex;flex-direction:column;align-items:center;flex:none}.pronunciation{height:31.5px;line-height:31.5px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-size:21px;color:#758b7b}.cell{width:105px;height:105px;display:grid;place-items:center;flex:none;border:1px solid #cad8cb;background:linear-gradient(45deg,transparent 49.5%,#e2eae1 50%,transparent 50.5%),linear-gradient(-45deg,transparent 49.5%,#e2eae1 50%,transparent 50.5%),linear-gradient(to right,transparent 49.5%,#dce6db 50%,transparent 50.5%),linear-gradient(to bottom,transparent 49.5%,#dce6db 50%,transparent 50.5%);font-family:var(--content-font);font-size:74px;color:#304b41}.punct{font-family:var(--content-font);font-size:37.5px;align-self:flex-end;padding-bottom:5px}.empty{font-size:14px;color:#9aa89c;padding:42px 0}.sr-only{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<header><div class="bar"><div class="brand"><span class="seal">笔</span><span>一笔一画，日积月累</span></div><nav class="nav" aria-label="主导航"><button id="words" class="active">字词</button><button id="poems">诗词</button><details class="book" id="book"><summary id="bookLabel"><span class="book-title" id="bookTitle">选择内容</span><span class="book-arrow" aria-hidden="true">▾</span></summary><div class="popup"><label for="grade">年级</label><select id="grade"></select><label for="term">学期</label><select id="term"><option>上册</option><option>下册</option></select><label for="directory">目录</label><select id="directory" disabled><option>暂无内容</option></select></div></details></nav></div></header>
<main><section class="sheet"><div class="heading"><div class="heading-top"><h1 id="title"></h1><button class="font-toggle" id="fontToggle" type="button" aria-label="切换为毛笔字体" aria-pressed="false" title="切换为毛笔字体"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M415 790Q427 790 472.0 760.0Q517 730 556.0 696.0Q595 662 595.0 651.0Q595 640 581.5 625.5Q568 611 559 611Q551 611 540 623Q510 654 477.0 681.0Q444 708 399 739Q386 748 386 756Q386 762 395.5 776.0Q405 790 415 790ZM501 280Q595 404 649 557L338 539Q371 469 414.5 399.0Q458 329 501 280ZM546 234Q728 61 943 -26Q957 -31 957 -38Q957 -43 946.5 -55.5Q936 -68 922.0 -78.0Q908 -88 897 -88Q894 -88 888 -86Q680 13 504 186Q426 105 333.5 45.0Q241 -15 165.5 -47.5Q90 -80 67 -80Q55 -80 55 -73Q55 -64 74 -54Q188 7 291.5 82.5Q395 158 460 231Q410 288 361.0 369.5Q312 451 271 535L185 530Q161 528 150 528Q133 528 122.0 534.0Q111 540 99 560Q94 568 90 579Q89 581 89 585Q89 592 97 592L102 591Q122 587 149 587H162L814 626Q841 628 865 634Q868 635 873 635Q885 635 899.0 626.0Q913 617 922.5 605.5Q932 594 932 588Q932 581 926.5 577.0Q921 573 913 572L730 561Q698 476 648.5 388.5Q599 301 546 234Z" transform="translate(1.1049 16.7316) scale(0.0171840 -0.0171840)" opacity=".38"/><path d="M400 345C374 345 302 408 286 408C272 408 264 392 264 380C264 373 296 349 303 344C322 330 342 318 365 310C374 307 383 304 391 299C390 290 377 273 371 265C328 204 246 161 176 139C158 133 125 111 125 89C125 87 127 86 129 86C133 86 137 87 141 88C172 94 204 97 233 110C308 143 393 192 426 272C465 251 494 211 523 178C552 144 578 112 603 75C613 61 634 51 649 43C708 12 764 7 829 7C840 7 874 7 874 23C874 37 832 45 821 48C787 56 759 70 732 92C674 139 608 176 555 229C523 261 487 290 453 320C469 348 587 485 587 488C587 501 547 511 537 511C484 511 432 345 400 345ZM147 511C147 503 187 485 195 481C228 465 264 459 300 459C332 459 398 489 426 506C469 532 517 550 564 565C588 573 713 576 720 585C722 587 723 591 723 593C723 611 669 615 656 615C613 615 573 596 531 596C519 596 526 617 526 623C526 683 463 700 418 716C411 719 393 731 387 731C380 731 376 724 376 718C376 710 436 598 445 579C401 555 318 552 265 533C245 526 223 526 202 524C194 523 147 520 147 511Z" transform="translate(3.6632 20.7362) scale(0.0206943 -0.0206943)" opacity="1"/></svg></button></div><p class="poet" id="poet" hidden></p></div><div id="content" class="content"></div></section></main>
<script>
const $=s=>document.querySelector(s);const base=location.hostname.endsWith('.github.io')?'/rijiyuelei':'';const fontStyle=document.createElement('style');fontStyle.textContent='@font-face{font-family:"LXGW WenKai GB";src:url("'+base+'/assets/fonts/LXGWWenKaiGB-Regular.woff2") format("woff2");font-style:normal;font-weight:400;font-display:block}@font-face{font-family:"Chill Long Cang";src:url("'+base+'/assets/fonts/ChillLongCang-Regular.woff2") format("woff2");font-style:normal;font-weight:400;font-display:swap}';document.head.appendChild(fontStyle);let records=[],mode='字词',selected='';const grades=['一年级','二年级','三年级','四年级','五年级','六年级'];$('#grade').innerHTML=grades.map(g=>`<option ${g==='六年级'?'selected':''}>${g}</option>`).join('');
function parseCSV(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell.replace(/\r$/,''));rows.push(row)}const headers=rows.shift().map(x=>x.replace(/^\uFEFF/,''));return rows.filter(r=>r.some(Boolean)).map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]||''])))}
function available(){const types=mode==='字词'?['汉字','词语']:['古诗','日积月累'];return records.filter(r=>r['年级']===$('#grade').value&&r['学期']===$('#term').value&&types.includes(r['类型']))}
function key(r){return r['ID']}
function addCells(text,container,syllables=[]){let index=0;for(const c of text){if(/\s/.test(c))continue;if(!/[\u3400-\u9fff]/.test(c)){const el=document.createElement('span');el.className='punct';el.textContent=c;container.appendChild(el);continue}const wrap=document.createElement('span');wrap.className='char-wrap';const py=document.createElement('span');py.className='pronunciation';const syllable=syllables[index++]||'';py.textContent=syllable==='_'||syllable==='?'?'':syllable;py.setAttribute('aria-hidden','true');const el=document.createElement('span');el.className='cell';el.textContent=c;wrap.append(py,el);container.appendChild(wrap)}}
function render(){const data=available(),choices=[...new Map(data.map(r=>[key(r),r])).entries()];if(!choices.some(([k])=>k===selected))selected=choices[0]?.[0]||'';const choice=choices.find(([k])=>k===selected)?.[1];const label=$('#grade').value+' · '+$('#term').value+' · '+(choice?(mode==='字词'?choice['课文']:choice['标题']):'暂无内容');$('#bookTitle').textContent=label;$('#bookLabel').title=label;$('#words').classList.toggle('active',mode==='字词');$('#poems').classList.toggle('active',mode==='诗词');const directory=$('#directory');directory.replaceChildren();directory.disabled=!choices.length;if(!choices.length)directory.add(new Option('暂无内容',''));choices.forEach(([k,r],i)=>directory.add(new Option(mode==='字词'?r['课文']:r['标题'],String(i),false,k===selected)));const current=data.filter(r=>key(r)===selected);$('#title').textContent=current.length?(mode==='字词'?current[0]['课文']:current[0]['标题']):'暂无内容';const poet=$('#poet');const dynasty=current[0]?.['朝代']?.trim()||'';const author=current[0]?.['作者']?.trim()||'';poet.textContent=[dynasty?'['+dynasty+']':'',author].filter(Boolean).join(' ');poet.hidden=mode!=='诗词'||!poet.textContent;const content=$('#content');content.replaceChildren();if(!current.length){let p=document.createElement('div');p.className='empty';p.textContent='请选择其他课本。';content.appendChild(p);return}const flow=mode==='字词'?document.createElement('div'):null;if(flow){flow.className='words-flow';content.appendChild(flow)}for(const r of current){let text=r['内容'].replace(/\\n/g,'\n');let lines=r['类型']==='词语'?text.split('|'):r['类型']==='汉字'?Array.from(text):text.split('\n');const paired=r['类型']==='古诗'&&!r['标题'].includes('·')&&r['标题']!=='二十四节气歌'&&lines.length>1&&lines.length%2===0&&lines.every((line,i)=>i%2===0?/^[\u3400-\u9fff]{4,7}，$/.test(line)&&/^[\u3400-\u9fff]{4,7}。$/.test(lines[i+1])&&line.length===lines[i+1].length:true);if(paired)lines=lines.filter((_,i)=>i%2===0).map((line,i)=>line+text.split('\n')[i*2+1]);const pinyin=(r['拼音']||'').replace(/\\n/g,'\n');let chunks=r['类型']==='词语'?pinyin.split('|'):lines.map(()=>[]);if(r['类型']!=='词语'){const all=pinyin.trim()?pinyin.trim().split(/\s+/):[];let offset=0;chunks=lines.map(line=>{let size=(line.match(/[\u3400-\u9fff]/g)||[]).length;let part=all.slice(offset,offset+size);offset+=size;return part});if(offset!==all.length)chunks=lines.map(()=>[])}lines.forEach((line,i)=>{let row=document.createElement('div');row.className=flow?'word-group':paired||/\s/.test(line.trim())?'row poem-row':'row';let syllables=Array.isArray(chunks[i])?chunks[i]:(chunks[i]||'').trim().split(/\s+/).filter(Boolean);if(syllables.length!==(line.match(/[\u3400-\u9fff]/g)||[]).length)syllables=[];if(paired){const cut=line.indexOf('，')+1;let offset=0;for(const clause of [line.slice(0,cut),line.slice(cut)]){const group=document.createElement('span');group.className='verse-clause';const count=(clause.match(/[\u3400-\u9fff]/g)||[]).length;addCells(clause,group,syllables.slice(offset,offset+count));offset+=count;row.appendChild(group)}}else if(!flow&&/\s/.test(line.trim())){let offset=0;for(const part of line.trim().split(/\s+/)){const group=document.createElement('span');group.className='verse-clause';const count=(part.match(/[\u3400-\u9fff]/g)||[]).length;addCells(part,group,syllables.slice(offset,offset+count));offset+=count;row.appendChild(group)}}else addCells(line,row,syllables);(flow||content).appendChild(row)})}}
function syncURL(replace=false){const rows=available();const r=rows.find(row=>key(row)===selected);let target;if(r){target=base+'/'+(mode==='字词'?'words':'poems')+'/'+[r['ID'],r['年级'],r['学期'],mode==='字词'?r['课文']:r['标题']].map(encodeURIComponent).join('/')+'/'}else{const query=new URLSearchParams({module:mode==='字词'?'words':'poems',grade:$('#grade').value,term:$('#term').value});target=base+'/?'+query}if(location.pathname+location.search!==target)history[replace?'replaceState':'pushState']({},'',target)}
const fontKey='rijiyuelei.font';function setFont(active){const button=$('#fontToggle'),label=active?'切换为默认字体':'切换为毛笔字体';$('.sheet').classList.toggle('brush-font',active);button.setAttribute('aria-pressed',String(active));button.setAttribute('aria-label',label);button.title=label}try{setFont(localStorage.getItem(fontKey)==='brush')}catch{setFont(false)}$('#fontToggle').onclick=()=>{const active=!$('.sheet').classList.contains('brush-font');setFont(active);try{localStorage.setItem(fontKey,active?'brush':'default')}catch{}};window.addEventListener('storage',e=>{if(e.key===fontKey||e.key===null)setFont(e.key===fontKey&&e.newValue==='brush')});
function navigate(){render();syncURL()}
function restore(){let parts;try{parts=location.pathname.slice(base.length).split('/').filter(Boolean).map(decodeURIComponent)}catch{parts=[]}const query=new URLSearchParams(location.search);const category=parts[0]||query.get('module');if(category==='words'||category==='poems')mode=category==='words'?'字词':'诗词';const grade=parts[2]||query.get('grade');const term=parts[3]||query.get('term');if(grades.includes(grade))$('#grade').value=grade;if(term==='上册'||term==='下册')$('#term').value=term;selected=parts[1]||'';render();syncURL(true)}
$('#directory').onchange=()=>{const choices=[...new Map(available().map(r=>[key(r),r])).entries()];const choice=choices[Number($('#directory').value)];if(choice){selected=choice[0];navigate()}};$('#words').onclick=()=>{mode='字词';selected='';navigate()};$('#poems').onclick=()=>{mode='诗词';selected='';navigate()};$('#grade').onchange=$('#term').onchange=()=>{selected='';navigate()};window.addEventListener('popstate',restore);document.addEventListener('click',e=>{for(const d of document.querySelectorAll('details'))if(!d.contains(e.target))d.open=false});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('details').forEach(d=>d.open=false)});
Promise.all(['/words.csv','/poems.csv'].map(path=>fetch(base+path+'?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.text()}))).then(([wordText,poemText])=>{const words=parseCSV(wordText).flatMap(row=>['汉字','词语'].filter(type=>row[type]?.trim()).map(type=>({...row,'类型':type,'标题':type,'内容':row[type],'拼音':row[type+'拼音']})));const poems=parseCSV(poemText).map(row=>({...row,'类型':'古诗','内容':row['正文'],'拼音':row['正文拼音']}));records=[...words,...poems];restore()}).catch(()=>{$('#title').textContent='内容加载失败'});
</script></body></html>
